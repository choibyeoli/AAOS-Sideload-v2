<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAOS Sideload Bypass Diagnostic Tool</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1115;color:#e2e8f0;padding:20px;max-width:800px;margin:0 auto}
  h1{font-size:1.5em;margin-bottom:8px;color:#f8fafc;letter-spacing:-0.5px}
  .sub{color:#94a3b8;font-size:0.9em;margin-bottom:24px}
  .m{background:#1e222a;border:1px solid #334155;border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:0 4px 6px -1px rgba(0,0,0,0.1)}
  .m h2{font-size:1.1em;color:#38bdf8;margin-bottom:6px;font-weight:600}
  .m .d{font-size:0.85em;color:#94a3b8;margin-bottom:16px;line-height:1.4}
  input[type=text]{width:100%;padding:12px;background:#0f1115;border:1px solid #475569;border-radius:6px;color:#f8fafc;font-size:0.95em;margin-bottom:12px;outline:none}
  input[type=text]:focus{border-color:#38bdf8}
  button{padding:12px 24px;border:none;border-radius:6px;font-size:0.95em;font-weight:600;cursor:pointer;width:100%;margin-bottom:8px;transition:all 0.2s}
  .bp{background:#0284c7;color:#fff}.bp:active{background:#0369a1}
  .bs{background:#334155;color:#cbd5e1}.bs:active{background:#475569}
  .bg{background:#16a34a;color:#fff}.bg:active{background:#15803d}
  hr{border:none;border-top:1px solid #334155;margin:12px 0 16px}
  .tag{display:inline-block;padding:3px 8px;border-radius:4px;font-size:0.7em;font-weight:600;margin-left:8px;vertical-align:middle;text-transform:uppercase}
  .t1{background:#064e3b;color:#34d399;border:1px solid #059669}
  .log{background:#000;border:1px solid #334155;border-radius:6px;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:0.8em;color:#cbd5e1;max-height:250px;overflow-y:auto;margin-top:12px;display:none;line-height:1.6}
  .log.show{display:block}
  .log-ok{color:#4ade80}.log-warn{color:#fbbf24}.log-err{color:#f87171}.log-info{color:#7dd3fc}
  .pbar{width:100%;height:6px;background:#334155;border-radius:3px;margin:8px 0;display:none;overflow:hidden}
  .pbar.show{display:block}
  .pfill{height:100%;background:#38bdf8;width:0%;transition:width 0.3s}
  .ptext{font-size:0.8em;color:#94a3b8;margin-bottom:4px;display:none}
  .ptext.show{display:block}
</style>
</head>
<body>

<h1>AAOS Bypass Diagnostic Tool</h1>
<p class="sub">차량용 안드로이드(AAOS) 브라우저 다운로드 제한 우회 모듈</p>

<div class="m">
  <h2>Method: 확장자 위장 기반 로컬 페이로드 실행 <span class="tag t1">Primary</span></h2>
  <p class="d">보안 필터를 우회할 수 있는 텍스트(.txt) 형식으로 패키지를 다운로드한 후, 로컬 메모리에서 MIME 타입을 재할당하여 설치 프로세스를 강제 호출합니다.</p>
  <hr>
  
  <input type="text" id="urlTxt" placeholder="설치할 대상의 URL (APK 형식)">
  
  <button class="bp" onclick="downloadAsTxt()">Step 1: 보안 필터 우회 다운로드 (.txt)</button>
  <div class="ptext" id="ptFS">대기 상태</div>
  <div class="pbar" id="pbFS"><div class="pfill" id="pfFS"></div></div>
  
  <button class="bs" onclick="document.getElementById('filePickTxt').click()" style="margin-top:16px;">Step 2: 로컬 파일 시스템에서 페이로드 로드</button>
  <input type="file" id="filePickTxt" accept=".txt, text/plain, */*" style="display:none" onchange="loadLocalPayload(this)">
  
  <div id="txtFileInfo" style="font-size:0.85em;color:#94a3b8;margin:8px 0;padding:8px;background:#0f1115;border-radius:4px;display:none;border:1px solid #334155;"></div>
  
  <button class="bg" onclick="executePayload()" id="btnExecuteTxt" style="display:none; margin-top:8px;">Step 3: 패키지 인스톨러 호출 (Blob Navigation)</button>
  
  <div class="log" id="logTxt"></div>
</div>

<div class="m">
  <h2>System Diagnostics</h2>
  <hr>
  <button class="bs" onclick="runDiag()">브라우저 환경 및 API 지원 여부 진단</button>
  <div class="log" id="logDiag"></div>
</div>

<script>
function $(id){return document.getElementById(id)}
function al(el,msg,t){
  el.classList.add('show');
  var d=document.createElement('div');
  d.className='log-'+(t||'info');
  d.textContent=(t==='ok'?'[SUCCESS] ':t==='err'?'[ERROR] ':t==='warn'?'[WARN] ':'[INFO] ')+msg;
  el.appendChild(d);
  el.scrollTop=el.scrollHeight;
}
function cl(el){el.innerHTML='';el.classList.add('show')}
function fb(b){return b<1024?b+' B':b<1048576?(b/1024).toFixed(2)+' KB':(b/1048576).toFixed(2)+' MB'}

// 데이터 스트림 수신 함수
async function fetchWithProgress(url, ptId, pbId, pfId, log) {
  var pt=$(ptId), pb=$(pbId), pf=$(pfId);
  pt.classList.add('show'); pb.classList.add('show');
  pt.textContent='대상 서버에 연결 중...';
  pf.style.width='0%';
  
  var startTime=Date.now();
  al(log,'Fetch 요청 시작: '+url,'info');

  try {
    var response = await fetch(url);
    if(!response.ok) throw new Error('HTTP 연결 실패 ('+response.status+')');

    var total = parseInt(response.headers.get('Content-Length')||'0');
    
    // 스트리밍을 지원하지 않는 환경 처리
    if(!response.body || !response.body.getReader) {
      al(log,'Reader API 미지원. 버퍼링 방식 수신 시작...','warn');
      pt.textContent='데이터 수신 중 (진행 상태 표시 불가)...';
      var blob = await response.blob();
      pf.style.width='100%';
      al(log,'데이터 수신 완료: '+fb(blob.size),'ok');
      pt.textContent='수신 완료: '+fb(blob.size);
      return blob;
    }

    var reader = response.body.getReader();
    var received = 0;
    var chunks = [];
    var lastUpdate = Date.now();

    while(true) {
      var result = await reader.read();
      if(result.done) break;
      chunks.push(result.value);
      received += result.value.length;

      var now = Date.now();
      if(now - lastUpdate > 300) {
        lastUpdate = now;
        if(total > 0) {
          var pct = Math.round(received/total*100);
          pf.style.width = pct+'%';
          pt.textContent = '수신 중: '+fb(received)+' / '+fb(total)+' ('+pct+'%)';
        } else {
          pt.textContent = '수신 중: '+fb(received);
        }
      }
    }
    pf.style.width='100%';
    pt.textContent='수신 완료: '+fb(received);
    al(log,'데이터 스트림 수신 성공: '+fb(received),'ok');
    return new Blob(chunks);
  } catch(e) {
    pt.textContent='요청 실패';
    al(log,'Fetch 프로세스 예외 발생: '+e.message,'err');
    throw e;
  }
}

// 전역 상태 변수
var _payloadFile = null;

// [Step 1] 확장자 위장 다운로드
async function downloadAsTxt() {
  var url = $('urlTxt').value.trim(), l = $('logTxt'); cl(l);
  if (!url) { al(l, '유효한 대상 URL을 입력하십시오.', 'err'); return; }
  
  try {
    al(l, '초기화 프로세스 시작. 바이너리 데이터를 요청합니다.', 'info');
    var rawBlob = await fetchWithProgress(url, 'ptFS', 'pbFS', 'pfFS', l);
    
    al(l, '수신된 데이터의 MIME 타입을 text/plain으로 재할당합니다.', 'info');
    var textMaskedBlob = new Blob([rawBlob], { type: 'text/plain' });
    var objectUrl = URL.createObjectURL(textMaskedBlob);
    
    al(l, '로컬 스토리지에 위장된 파일 쓰기 프로세스를 호출합니다.', 'info');
    var a = document.createElement('a');
    a.href = objectUrl;
    a.download = 'payload_masked.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    
    al(l, '다운로드 트리거가 전송되었습니다. 브라우저의 다운로드 승인을 확인하십시오.', 'ok');
  } catch(e) {
    al(l, '다운로드 프로세스 실패: ' + e.message, 'err');
  }
}

// [Step 2] 로컬 파일 로드 및 유효성 검증
function loadLocalPayload(input) {
  var l = $('logTxt');
  if (!input.files || input.files.length === 0) return;
  
  var file = input.files[0];
  _payloadFile = file; 
  
  $('txtFileInfo').style.display = 'block';
  $('txtFileInfo').innerHTML = '📄 <b>' + file.name + '</b><br>크기: ' + fb(file.size) + ' / 타입: ' + (file.type || 'text/plain');
  $('btnExecuteTxt').style.display = 'block';
  
  al(l, '로컬 파일이 메모리에 성공적으로 마운트되었습니다. [Step 3]를 통해 실행을 시도하십시오.', 'ok');
  input.value = ''; 
}

// [Step 3] 패키지 인스톨러 호출 (Blob Navigation)
async function executePayload() {
  var l = $('logTxt');
  if (!_payloadFile) {
    al(l, '마운트된 페이로드가 없습니다.', 'err');
    return;
  }
  
  al(l, '안드로이드 네이티브 환경으로 핸드오프(Handoff)를 준비합니다.', 'info');

  try {
    // 1. 순정 안드로이드 패키지 MIME 타입으로 복원
    al(l, 'MIME 타입을 application/vnd.android.package-archive 로 복원 중...', 'info');
    var apkBlob = new Blob([_payloadFile], { type: 'application/vnd.android.package-archive' });
    var targetUrl = URL.createObjectURL(apkBlob);
    
    // 2. 브라우저 내비게이션을 통한 시스템 처리 유도
    al(l, '브라우저 주소창 내비게이션을 통해 시스템 패키지 인스톨러로 권한을 위임합니다.', 'info');
    window.location.href = targetUrl;
    
    al(l, '호출 신호가 전송되었습니다. OS의 설치 관리자 팝업을 확인하십시오.', 'ok');
  } catch(e) {
    al(l, '핸드오프 프로세스 실패: ' + e.message, 'err');
  }
}

// 시스템 진단
function runDiag(){
  var l=$('logDiag');cl(l);
  al(l,'System Information','info');
  al(l,'UserAgent: '+navigator.userAgent,'info');
  al(l,'Platform: '+navigator.platform,'info');
  
  al(l,'\nAPI Capabilities','info');
  var apis = [
    ['Blob API', typeof Blob !== 'undefined'],
    ['URL.createObjectURL', !!URL.createObjectURL],
    ['Web Share API (navigator.share)', !!navigator.share],
    ['File System Access (showSaveFilePicker)', 'showSaveFilePicker' in window]
  ];
  
  apis.forEach(function(c){
    al(l, c[0] + ': ' + (c[1] ? 'Supported' : 'Not Supported'), c[1] ? 'ok' : 'err');
  });
  
  al(l,'\n진단이 완료되었습니다. Web Share API가 제한된 환경이므로 Navigation 우회 방식을 권장합니다.','info');
}
</script>
</body>
</html>
