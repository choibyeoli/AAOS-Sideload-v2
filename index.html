<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAOS Share Fuzzer v11</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#050505;color:#e2e8f0;padding:20px;max-width:800px;margin:0 auto}
  h1{font-size:1.5em;margin-bottom:8px;color:#f8fafc;letter-spacing:-0.5px}
  .sub{color:#94a3b8;font-size:0.9em;margin-bottom:24px}
  .m{background:#111;border:1px solid #333;border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:0 4px 6px -1px rgba(0,0,0,0.5)}
  .m h2{font-size:1.1em;color:#38bdf8;margin-bottom:6px;font-weight:600}
  .m .d{font-size:0.85em;color:#94a3b8;margin-bottom:16px;line-height:1.4}
  input[type=text]{width:100%;padding:12px;background:#000;border:1px solid #444;border-radius:6px;color:#f8fafc;font-size:0.95em;margin-bottom:12px;outline:none}
  input[type=text]:focus{border-color:#38bdf8}
  button{padding:12px 24px;border:none;border-radius:6px;font-size:0.95em;font-weight:600;cursor:pointer;width:100%;margin-bottom:8px;}
  .bp{background:#0284c7;color:#fff}.bp:active{background:#0369a1}
  .bs{background:#334155;color:#cbd5e1}.bs:active{background:#475569}
  .bg{background:#059669;color:#fff}.bg:active{background:#047857}
  hr{border:none;border-top:1px solid #333;margin:12px 0 16px}
  .log{background:#000;border:1px solid #222;border-radius:6px;padding:12px;font-family:monospace;font-size:0.8em;color:#cbd5e1;max-height:250px;overflow-y:auto;margin-top:12px;display:none;line-height:1.6}
  .log.show{display:block}
  .log-ok{color:#4ade80}.log-warn{color:#fbbf24}.log-err{color:#f87171}.log-info{color:#7dd3fc}
</style>
</head>
<body>

<h1>Share Fuzzer v11</h1>
<p class="sub">브라우저 검열 우회 및 인스톨러 후킹을 위한 MIME 교차 테스트</p>

<div class="m">
  <h2>1. RAM에 파일 장전</h2>
  <hr>
  <input type="text" id="urlInput" placeholder="APK URL 입력">
  <button class="bp" onclick="loadToRAM()">페이로드 메모리 적재 (필수)</button>
  <div class="log" id="logRam"></div>
</div>

<div class="m" id="fuzzArea" style="display:none; border-color:#059669;">
  <h2 style="color:#10b981;">2. 확장자 / MIME 섞어치기 타격</h2>
  <p class="d">어떤 조합이 웨일의 차단을 피하면서 동시에 공유 창에 '패키지 설치'를 띄우는지 테스트합니다.</p>
  <hr>
  
  <button class="bs" onclick="fuzzShare('app.apk', 'text/plain')">타격 1: 이름(.apk) + 타입(text/plain)</button>
  
  <button class="bs" onclick="fuzzShare('app.apk', '*/*')">타격 2: 이름(.apk) + 타입(*/*)</button>
  
  <button class="bs" onclick="fuzzShare('app.apk', '')">타격 3: 이름(.apk) + 타입(비워둠)</button>
  
  <button class="bs" onclick="fuzzShare('app.txt', 'application/vnd.android.package-archive')">타격 4: 이름(.txt) + 타입(APK)</button>
  
  <button class="bs" onclick="fuzzShare('app.zip', 'application/zip')">타격 5: 이름(.zip) + 타입(application/zip)</button>
  
  <div class="log" id="logShare"></div>
</div>

<script>
function $(id){return document.getElementById(id)}
function al(el,msg,t){
  el.classList.add('show');
  var d=document.createElement('div');
  d.className='log-'+(t||'info');
  d.textContent=(t==='ok'?'[SUCCESS] ':t==='err'?'[ERROR] ':t==='warn'?'[WARN] ':'[INFO] ')+msg;
  el.appendChild(d); el.scrollTop=el.scrollHeight;
}
function cl(el){el.innerHTML='';el.classList.add('show')}
function fb(b){return b<1024?b+' B':b<1048576?(b/1024).toFixed(2)+' KB':(b/1048576).toFixed(2)+' MB'}

var _ramBlob = null;

async function loadToRAM() {
  var url = $('urlInput').value.trim(), l = $('logRam'); cl(l);
  if (!url) { al(l, 'URL을 입력하십시오.', 'err'); return; }
  
  al(l,'네트워크 요청 시작...','info');
  try {
    var response = await fetch(url);
    if(!response.ok) throw new Error('HTTP ' + response.status);
    _ramBlob = await response.blob();
    al(l,'메모리 적재 완료! 크기: ' + fb(_ramBlob.size), 'ok');
    $('fuzzArea').style.display = 'block';
  } catch(e) {
    al(l, '적재 실패: ' + e.message, 'err');
  }
}

async function fuzzShare(fileName, mimeType) {
  var l = $('logShare'); cl(l);
  if (!_ramBlob) return;
  if (!navigator.share) { al(l, 'Share API 미지원 브라우저', 'err'); return; }

  al(l, `테스트 조합 -> 이름: [${fileName}] / MIME: [${mimeType || '없음'}]`, 'info');
  try {
    var spoofedFile = new File([_ramBlob], fileName, { type: mimeType });
    
    if (navigator.canShare && navigator.canShare({ files: [spoofedFile] })) {
      await navigator.share({
        files: [spoofedFile],
        title: 'APK Install Test',
        text: '목록에 패키지 설치가 뜨는지 확인하세요.'
      });
      al(l, '✅ 브라우저 검열 통과! 공유 창 목록을 확인하십시오.', 'ok');
    } else {
      al(l, '❌ 브라우저가 이 조합의 공유를 차단했습니다.', 'err');
    }
  } catch (e) {
    al(l, '공유 에러: ' + e.message, 'err');
  }
}
</script>
</body>
</html>
